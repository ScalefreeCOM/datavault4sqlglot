id: "2.2.2.4"
title: "Incremental, NEW BK in both sources with SAME load_date -> a single new row is inserted"
entity: hub
mode: incremental

# Same generator gap as 2.2.1.3: spec ('TestCases' 2.2.2.4) wants the leading
# source to win on an ldts tie, but the dedup (ROW_NUMBER ... ORDER BY ldts, no
# secondary tie-break) makes the surviving rsrc arbitrary. We assert the
# deterministic part — exactly ONE new row inserted with the correct HK / BK /
# ldts — and do NOT project rsrc. Leading-source priority is a flagged gap.

entity_spec:
  target: { database: DV, schema: RAW_VAULT, table: HUB_ORDER }
  hashkey: HK_ORDER_H
  business_keys: [ORDER_ID]
  sources:
    - { database: RAW_DB, schema: STAGE, table: STG_SAP_ORDERS,
        load_date_col: LOAD_DATE, record_source_col: RECORD_SOURCE, bk_columns: [SAP_ORDER_ID] }
    - { database: RAW_DB, schema: STAGE, table: STG_WEB_ORDERS,
        load_date_col: LOAD_DATE, record_source_col: RECORD_SOURCE, bk_columns: [WEB_ORDER_ID] }

current_state:
  - table: DV.RAW_VAULT.HUB_ORDER
    rows:
      - { HK_ORDER_H: "h_existing", ORDER_ID: "EXIST", ldts: "2026-01-01", rsrc: "SAP/ORDERS" }

input:
  - table: RAW_DB.STAGE.STG_SAP_ORDERS
    rows:
      - { HK_ORDER_H: "h_new", SAP_ORDER_ID: "NEW", LOAD_DATE: "2026-01-05", RECORD_SOURCE: "SAP/ORDERS" }
  - table: RAW_DB.STAGE.STG_WEB_ORDERS
    rows:
      - { HK_ORDER_H: "h_new", WEB_ORDER_ID: "NEW", LOAD_DATE: "2026-01-05", RECORD_SOURCE: "WEB/ORDERS" }

expect:
  match_mode: exact
  key_columns: [HK_ORDER_H, ORDER_ID, ldts]
  rows:
    - { HK_ORDER_H: "h_new", ORDER_ID: "NEW", ldts: "2026-01-05" }
