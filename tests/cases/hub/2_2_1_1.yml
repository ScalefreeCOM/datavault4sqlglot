id: "2.2.1.1"
title: "Initial, two sources, two BKs: same BK in both sources with different LDTS -> earliest is inserted"
entity: hub
mode: initial

entity_spec:
  target: { database: DV, schema: RAW_VAULT, table: HUB_ORDER }
  hashkey: HK_ORDER_H
  business_keys: [ORDER_ID]
  sources:
    - { database: RAW_DB, schema: STAGE, table: STG_SAP_ORDERS,
        load_date_col: LOAD_DATE, record_source_col: RECORD_SOURCE, bk_columns: [SAP_ORDER_ID] }
    - { database: RAW_DB, schema: STAGE, table: STG_WEB_ORDERS,
        load_date_col: LOAD_DATE, record_source_col: RECORD_SOURCE, bk_columns: [WEB_ORDER_ID] }

input:
  - table: RAW_DB.STAGE.STG_SAP_ORDERS
    rows:
      - { HK_ORDER_H: "h1", SAP_ORDER_ID: "A1", LOAD_DATE: "2026-01-05", RECORD_SOURCE: "SAP/ORDERS" }
  - table: RAW_DB.STAGE.STG_WEB_ORDERS
    rows:
      - { HK_ORDER_H: "h1", WEB_ORDER_ID: "A1", LOAD_DATE: "2026-01-03", RECORD_SOURCE: "WEB/ORDERS" }

expect:
  match_mode: exact
  key_columns: [ORDER_ID, ldts, rsrc]
  rows:
    - { ORDER_ID: "A1", ldts: "2026-01-03", rsrc: "WEB/ORDERS" }
