id: "2.1.1.1"
title: "Initial, one source, one BK: same BK over two batches -> earliest is inserted"
entity: hub
mode: initial

entity_spec:
  target: { database: DV, schema: RAW_VAULT, table: HUB_ORDER }
  hashkey: HK_ORDER_H
  business_keys: [ORDER_ID]
  sources:
    - { database: RAW_DB, schema: STAGE, table: STG_ORDERS,
        load_date_col: LOAD_DATE, record_source_col: RECORD_SOURCE }

input:
  - table: RAW_DB.STAGE.STG_ORDERS
    rows:
      - { HK_ORDER_H: "h1", ORDER_ID: "A1", LOAD_DATE: "2026-01-03", RECORD_SOURCE: "ERP/ORDERS" }
      - { HK_ORDER_H: "h1", ORDER_ID: "A1", LOAD_DATE: "2026-01-05", RECORD_SOURCE: "ERP/ORDERS" }

expect:
  match_mode: exact
  key_columns: [HK_ORDER_H, ldts]
  rows:
    - { HK_ORDER_H: "h1", ldts: "2026-01-03" }
